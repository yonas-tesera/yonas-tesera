name: Metrics

on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
  push: { branches: ["main", "master"] }

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Contribution calendar
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: yonas-tesera
          template: classic
          filename: metrics-calendar.svg
          config_timezone: Africa/Addis_Ababa
          config_padding: 0
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      # Joined year, total contribs, followers, repos; top languages; also
      # patches the calendar block's "Best streak" field with all-time total PRs & commits
      - name: Generate stats and languages cards
        env:
          GH_USER: yonas-tesera
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          git pull --rebase
          python3 scripts/stats.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics-stats.svg metrics-calendar.svg metrics-languages.svg
          git diff --staged --quiet || git commit -m "Update stats and languages cards"
          git push
